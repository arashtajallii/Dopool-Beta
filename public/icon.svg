      <stop offset="0%" stop-color="#060913"/>
      <stop offset="50%" stop-color="#0b1728"/>
      <stop offset="100%" stop-color="#062e24"/>
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
